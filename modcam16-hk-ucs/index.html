<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101216" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
    />
    <title>modCAM16-HK Cartesian Color Picker</title>
    <script type="module" crossorigin src="./assets/index-9YLITxR4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C132MXkk.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="visuals">
        <div class="plot-frame" aria-busy="true">
          <canvas
            id="gamut-slice"
            width="512"
            height="512"
            aria-label="J', x', and y' gamut slice"
          ></canvas>
          <canvas
            id="gamut-indicators"
            width="512"
            height="512"
            aria-hidden="true"
          ></canvas>
          <span id="plot-status" class="plot-status" role="status"
            >Loading color engine…</span
          >
        </div>
        <div class="preview-panel">
          <div class="preview-column">
            <div id="preview-surround" class="preview-surround">
              <div
                id="preview"
                class="preview"
                aria-label="Chosen color preview"
              ></div>
            </div>
          </div>
          <div class="preview-details">
            <span id="rgb-label">Linear Rec.709 (sRGB)<sup>*</sup></span>
            <code id="linear-value">(0.000, 0.000, 0.000)</code>
            <span id="encoded-label">sRGB Encoded Rec.709 (sRGB)</span>
            <div class="encoded-value-row">
              <div class="hex-input">
                <span class="hex-prefix" aria-hidden="true">#</span>
                <input
                  id="encoded-value"
                  class="encoded-value"
                  type="text"
                  value="000000"
                  maxlength="6"
                  pattern="[0-9A-Fa-f]{6}"
                  spellcheck="false"
                  aria-label="Six sRGB Encoded Rec.709 hexadecimal digits"
                />
              </div>
              <button id="copy-value" class="action-button" type="button">
                Copy
              </button>
              <button id="set-value" class="action-button" type="button">
                Set
              </button>
            </div>
            <span
              id="colorchecker-name"
              class="colorchecker-name"
              hidden
            ></span>
          </div>
          <div class="background-control">
            <label for="background-brightness"
              >Background
              <span class="control-value" id="background-brightness-value"
                >0.150</span
              ></label
            >
            <div class="range-wrap">
              <span
                id="background-stick"
                class="stick-marker"
                hidden
                aria-hidden="true"
              ></span>
              <input
                id="background-brightness"
                type="range"
                min="0"
                max="1"
                step="0.001"
                value="0.423582871"
                aria-label="Linear background brightness"
              />
            </div>
          </div>
        </div>
      </section>
      <section class="controls" aria-label="Color controls">
        <div class="control-row profile-row">
          <label for="profile">Mode</label>
          <select id="profile" aria-label="Source gamut and transform">
            <option value="3" selected>Rec.709 / No view transform</option>
            <option value="1">
              Rec.709 / ACES 2.0 - SDR 100 nits (Rec.709)
            </option>
            <option value="4">P3-D65 / ACES 2.0 - SDR 100 nits (P3 D65)</option>
            <option value="2">
              P3-D65 / ACES 2.0 - HDR 1000 nits (P3 D65)
            </option>
            <option value="0">
              Rec.2020 (P3-D65 limited) / ACES 2.0 - HDR 1000 nits (Rec.2020)
            </option>
          </select>
        </div>
        <div class="control-band" aria-label="J prime and fitted-radius controls">
          <div class="j-rail-control">
            <span class="control-label" id="j-label">J'</span>
            <div class="j-rail" id="j-rail">
              <div class="j-ticks" aria-hidden="true">
                <span style="--tick: 0">0.0</span>
                <span style="--tick: 0.1">0.1</span>
                <span style="--tick: 0.2">0.2</span>
                <span style="--tick: 0.3">0.3</span>
                <span style="--tick: 0.4">0.4</span>
                <span style="--tick: 0.5">0.5</span>
                <span style="--tick: 0.6">0.6</span>
                <span style="--tick: 0.7">0.7</span>
                <span style="--tick: 0.8">0.8</span>
                <span style="--tick: 0.9">0.9</span>
                <span style="--tick: 1">1.0</span>
              </div>
              <span id="j-reference-tick" class="j-reference-tick" aria-hidden="true"></span>
              <span id="j-stick" class="j-patch-tick" hidden aria-hidden="true"></span>
              <input
                id="j-rail-input"
                class="j-rail-input"
                type="range"
                min="0"
                max="1"
                step="any"
                value="0.3"
                aria-labelledby="j-label"
              />
            </div>
          </div>
          <div class="rolling-control">
            <span class="control-label" id="rolling-label">x' / y'</span>
            <div
              id="rolling-pad"
              class="rolling-pad"
              tabindex="0"
              role="group"
              aria-labelledby="rolling-label"
              aria-describedby="rolling-value"
            >
              <span id="x-stick" class="rolling-locator rolling-locator-x" hidden aria-hidden="true"></span>
              <span id="y-stick" class="rolling-locator rolling-locator-y" hidden aria-hidden="true"></span>
              <span id="rolling-ball" class="rolling-ball" aria-hidden="true"></span>
            </div>
            <span id="rolling-value" class="rolling-value" aria-live="polite">x' 0.380, y' 0.650</span>
          </div>
        </div>
      </section>
      <footer class="app-footer">
        * The raw J', x', and y' channels select this value.
      </footer>
    </main>
  </body>
</html>
