<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101216" />
    <title>modCAM16-HK gamut slice</title>
    <script type="module" crossorigin src="./assets/index-C0b4SU5V.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-2kgmDKXe.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="visuals">
        <div class="plot-frame">
          <canvas id="gamut-slice" width="256" height="256" aria-label="256 by 256 rendered gamut slice"></canvas>
        </div>
        <div class="preview-panel">
          <div class="preview-column">
            <div id="preview-surround" class="preview-surround">
              <div id="preview" class="preview" aria-label="Chosen color preview"></div>
            </div>
          </div>
          <div class="preview-details">
            <span>ACEScg<sup>*</sup></span>
            <code id="acescg-value">(0.000, 0.000, 0.000)</code>
            <span id="preview-status">Loading...</span>
            <span id="colorchecker-name" class="colorchecker-name" hidden></span>
          </div>
          <div class="background-control">
            <label for="background-brightness">Background <span class="control-value" id="background-brightness-value">0.500</span></label>
            <input id="background-brightness" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="Background brightness" />
          </div>
        </div>
      </section>
      <section class="controls" aria-label="Color controls">
        <div class="control-row">
          <label for="reflectance">Refl</label>
          <div class="slider-control">
            <div class="range-wrap">
              <span id="reflectance-stick" class="stick-marker" hidden aria-hidden="true"></span>
              <input id="reflectance" type="range" min="0" max="1" step="0.001" value="0.5" />
            </div>
            <input id="reflectance-number" class="number-input" type="number" min="0" max="1" step="any" value="0.500" inputmode="decimal" aria-label="Reflectance value" />
          </div>
        </div>
        <div class="control-row">
            <label for="hue">Hue <span class="unit">°</span></label>
          <div class="slider-control">
            <div class="range-wrap">
              <span id="hue-sticks" class="stick-points" aria-hidden="true"></span>
              <input id="hue" type="range" min="0" max="360" step="0.001" value="0" />
            </div>
            <input id="hue-number" class="number-input" type="number" min="0" max="360" step="any" value="0.000" inputmode="decimal" aria-label="Hue value in degrees" />
          </div>
        </div>
        <div class="control-row">
          <label for="saturation">Sat <span class="unit">%</span></label>
          <div class="slider-control">
            <div class="range-wrap">
              <span id="saturation-stick" class="stick-marker" hidden aria-hidden="true"></span>
              <input id="saturation" type="range" min="0" max="100" step="0.001" value="0" />
            </div>
            <input id="saturation-number" class="number-input" type="number" min="0" max="100" step="any" value="0.000" inputmode="decimal" aria-label="Saturation percentage" />
          </div>
        </div>
      </section>
      <footer class="app-footer">* Applying the ACES 2.0 view transform P3-D65_1000nit_in_Rec2100-D65_ST2084 to this ACEScg value yields the selected Refl, Hue, and Saturation.</footer>
    </main>
  </body>
</html>
