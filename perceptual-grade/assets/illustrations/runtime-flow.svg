<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
<title id="title">One current grade, rendering and diagnostic feedback</title>
<desc id="desc">Control edits update parameter state. That state supplies Direct values, a LUT bake guarded by a matching parameter signature, and scope evaluation. The selected native evaluator transforms input pixels into rendered pixels. Scopes use cached samples and an independent Color Reference.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#74736e"/></marker></defs>
<rect width="1120" height="920" rx="12" fill="#faf9f6"/>
<g fill="none" stroke="#74736e" stroke-width="2.2" marker-end="url(#arrow)">
<path d="M560 113V165"/><path d="M440 255V290H270V335"/><path d="M620 255V335"/><path d="M760 210H1095V710H1080"/>
<path d="M620 425V475"/><path d="M550 565V620H420V665"/><path d="M270 425V665"/>
<path d="M380 755V815"/><path d="M115 590V625H210V665"/><path d="M955 560V665"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#282925" text-anchor="middle">
<text x="56" y="43" font-size="16" text-anchor="start" fill="#716f66" letter-spacing="2">PERCEPTUAL GRADE RUNTIME</text>
