<text x="560" y="201" font-size="23">Current parameter state</text><text x="560" y="231" font-size="16">Model equations and grade signature</text>
<rect x="115" y="335" width="310" height="90" rx="7" fill="#fff" stroke="#c8c5ba"/>
<text x="270" y="372" font-size="23">Direct values</text><text x="270" y="400" font-size="16">Matrix, coefficients, curve textures</text>
<rect x="475" y="335" width="290" height="90" rx="7" fill="#fff" stroke="#c8c5ba"/>
<text x="620" y="372" font-size="23">Analytic LUT bake</text><text x="620" y="400" font-size="16">Signed HDR sample grid</text>
<rect x="475" y="475" width="290" height="90" rx="7" fill="#fff" stroke="#a48830"/>
<text x="620" y="511" font-size="21">Signature still matches?</text><text x="620" y="539" font-size="16">Only current results publish</text>
<text x="564" y="602" font-size="15" fill="#716f66">Ready LUT</text>
<rect x="40" y="530" width="150" height="60" rx="7" fill="#eeede8" stroke="#c8c5ba"/>
<text x="115" y="566" font-size="19">Input pixels</text>
<rect x="190" y="665" width="380" height="90" rx="7" fill="#fff" stroke="#a48830" stroke-width="2"/>
<text x="380" y="702" font-size="23">Native evaluator</text><text x="380" y="730" font-size="16">Exact Linear + selected Tone / Color path</text>
<rect x="190" y="815" width="380" height="65" rx="7" fill="#eeede8" stroke="#c8c5ba"/>
<text x="380" y="854" font-size="23">Rendered pixels</text>
<rect x="830" y="490" width="250" height="70" rx="7" fill="#eeede8" stroke="#c8c5ba"/>
<text x="955" y="519" font-size="20">Cached input samples</text><text x="955" y="544" font-size="16">and Color Reference</text>
