21 L 3015.5 821" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="2479" y="837" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">reconcile Grade nodes; wait for preparation</text></g><g class="KGJsZW5kZXIgLSZndDsgY29uc3VtZXIpWzBd"><path d="M 3017.5 947 L 1941.5 947" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="2479" y="963" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">observe live scene/time; validate Grade signature/output</text></g><g class="KGNvbnN1bWVyIC0mZ3Q7IGdhdGUpWzNd"><path d="M 1935.5 1073 L 1128.5 1073" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="1531.5" y="1089" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">publish for this active ticket</text></g><g class="KGdhdGUgLSZndDsgY29uc3VtZXIpWzNd"><path d="M 1126.5 1199 L 1933.5 1199" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="1531.5" y="1215" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">recheck ticket and exclusive render access</text></g><g class="KGdhdGUgLSZndDsgY29uc3VtZXIpWzFd"><path d="M 1126.5 1457 L 1933.5 1457" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="1531.5" y="1473" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">release</text></g><g class="KGNvbnN1bWVyIC0mZ3Q7IGdhdGUpWzFd"><path d="M 1935.5 1583 L 1128.5 1583" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="1531" y="1599" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">leave scope; deliver</text></g><g class="KGdhdGUgLSZndDsgcmVuZGVyKVswXQ=="><path d="M 1122.5 1709 L 167.5 1709" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="644" y="1725" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">wake; continue frame</text></g><g class="KGdhdGUgLSZndDsgY29uc3VtZXIpWzJd"><path d="M 1126.5 1901 L 1933.5 1901" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="1531" y="1917" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">fail with error</text></g><g class="KGNvbnN1bWVyIC0mZ3Q7IGJsZW5kZXIpWzBd"><path d="M 1939.5 2027 L 3015.5 2027" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="2479" y="2043" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">attempt visible failure output</text></g><g class="KGNvbnN1bWVyIC0mZ3Q7IGdhdGUpWzJd"><path d="M 1935.5 2153 L 1128.5 2153" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="1531.5" y="2169" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">finish_render_preflight_failure</text></g><g class="KGdhdGUgLSZndDsgcmVuZGVyKVsxXQ=="><path d="M 1122.5 2279 L 167.5 2279" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-605941199-3488378134)" mask="url(#d2-605941199)" /><text x="644" y="2295" fill="#111827" class="text" style="text-anchor:middle;font-size:44px">wake; raise failure</text></g></svg></svg>
